<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D18"/>
      <stop offset="50%" stop-color="#0B1528"/>
      <stop offset="100%" stop-color="#050B14"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2583F7"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2583F7" stop-opacity="0"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" rx="32" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#26364D" stroke-width="1" opacity="0.35">
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="700" y1="0" x2="700" y2="800"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="700" x2="800" y2="700"/>
  </g>

  <!-- Central Glowing Ambient Circle -->
  <circle cx="400" cy="380" r="220" fill="url(#glowGrad)" opacity="0.25"/>

  <!-- AI Neural Token Graphic -->
  <g filter="url(#neonGlow)">
    <!-- Outer Hexagon Ring -->
    <polygon points="400,200 550,285 550,455 400,540 250,455 250,285" 
             fill="none" stroke="#2583F7" stroke-width="4" stroke-dasharray="12 8" opacity="0.7"/>

    <!-- Inner Isometric AI Cube -->
    <!-- Top Face -->
    <polygon points="400,240 510,305 400,370 290,305" 
             fill="#2583F7" opacity="0.9"/>
    <!-- Left Face -->
    <polygon points="290,305 400,370 400,500 290,435" 
             fill="#1D4ED8" opacity="0.95"/>
    <!-- Right Face -->
    <polygon points="400,370 510,305 510,435 400,500" 
             fill="#38BDF8" opacity="0.85"/>

    <!-- Neural Core Sparkle in Center -->
    <circle cx="400" cy="370" r="14" fill="#FFFFFF"/>
    <line x1="400" y1="240" x2="400" y2="370" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
    <line x1="290" y1="305" x2="400" y2="370" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
    <line x1="510" y1="305" x2="400" y2="370" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- Tech Connecting Dots -->
  <circle cx="250" cy="285" r="7" fill="#38BDF8"/>
  <circle cx="550" cy="285" r="7" fill="#38BDF8"/>
  <circle cx="550" cy="455" r="7" fill="#2583F7"/>
  <circle cx="400" cy="540" r="7" fill="#38BDF8"/>
  <circle cx="250" cy="455" r="7" fill="#2583F7"/>
  <circle cx="400" cy="200" r="7" fill="#38BDF8"/>

  <!-- Text Branding -->
  <text x="400" y="620" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="46" 
        letter-spacing="6" 
        fill="#F8FAFC">
    MUSE <tspan fill="#38BDF8">AI</tspan>
  </text>

  <text x="400" y="665" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-weight="700" 
        font-size="20" 
        letter-spacing="4" 
        fill="#94A3B8">
    TOKEN REFILL &amp; PRO ACCESS
  </text>
  
  <rect x="290" y="695" width="220" height="34" rx="17" fill="#111A2B" stroke="#26364D" stroke-width="1.5"/>
  <text x="400" y="718" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-weight="800" 
        font-size="13" 
        letter-spacing="2" 
        fill="#10B981">
    ✓ OFFICIAL REFILL SERVICE
  </text>
</svg>
